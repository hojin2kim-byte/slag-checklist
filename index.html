.item{padding:9px;border-bottom:1px solid #e2e8f0}.rowtop{display:grid;grid-template-columns:28px 1fr;gap:7px}.no{font-weight:700;color:#475569}
.ru{font-size:13px;font-weight:700;line-height:1.35}.ko{font-size:12px;color:#475569;margin-top:3px}
.status{display:flex;gap:5px;margin:7px 0}.status button{flex:1;padding:6px;background:white;color:#334155;border:1px solid #cbd5e1}

.photo img{width:100%;height:90px;object-fit:contain;background:#e5e7eb;border-radius:5px}.pl{font-size:10px;font-weight:700;color:#475569;margin-bottom:4px}
.cam{width:100%;background:#2563eb;padding:7px;font-size:12px}.gallery{width:100%;background:#0f766e;padding:7px;font-size:12px;margin-top:4px}.del{background:#64748b;padding:4px 7px;font-size:11px;margin-top:3px}
textarea{width:100%;min-height:55px;margin-top:7px;padding:7px;border:1px solid #cbd5e1;border-radius:6px}
.time{font-size:11px;color:#64748b;margin-top:5px}.time input{padding:4px}
#notice{font-size:11px;color:#475569;text-align:center;padding:8px}
#printArea{display:none}
@media(min-width:800px){.item{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}}
@media print{
 @page{size:A4 landscape;margin:6mm}
 html,body{width:100%;margin:0;padding:0}
 section.equip{width:100%;height:calc(210mm - 12mm);box-sizing:border-box;page-break-before:always;break-before:page;overflow:hidden}
 section.equip:first-of-type{page-break-before:auto;break-before:auto}
 
 body{background:white;font-size:9pt}header,#app,#notice{display:none!important}#printArea{display:block}
 .phead{font-size:18pt;font-weight:700;margin-bottom:3mm}.pmeta{font-size:9pt;margin-bottom:4mm}
 .pequip{page-break-before:always}.pequip:first-child{page-break-before:auto}
 .ptitle{font-size:14pt;font-weight:700;background:#eee;padding:3mm;margin-bottom:2mm}

 .pno{font-weight:700}.pru{font-weight:700;font-size:9pt}.pko{font-size:8pt;color:#444;margin-top:1mm}

const DBNAME="SlagChecklistPhotos_v2",STORE="photos";let db=null,catKey=Object.keys(DATA)[0],idx=0,state={};

function rowState(r){let k=idx+"_"+r;if(!state[k])state[k]={status:"",action:"",actionRu:"",translation:"",time:""};return state[k]}
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DBNAME,1);q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE))e.target.result.createObjectStore(STORE,{keyPath:"id"})};q.onsuccess=e=>{db=e.target.result;res()};q.onerror=()=>rej(q.error)})}
function pid(c,e,r,t){return c+"_"+e+"_"+r+"_"+t}
function getPhoto(id){return new Promise(res=>{let q=db.transaction(STORE,"readonly").objectStore(STORE).get(id);q.onsuccess=()=>res(q.result?.blob||null);q.onerror=()=>res(null)})}
function putPhoto(id,b){return new Promise((res,rej)=>{let q=db.transaction(STORE,"readwrite").objectStore(STORE).put({id,blob:b});q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function delPhoto(id){return new Promise(res=>{let q=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);q.onsuccess=res;q.onerror=res})}

const RU_KR=KR_RU.map(x=>[x[1],x[0]]);
function translateByPhrases(text, pairs){ let out=text; const sorted=[...pairs].sort((a,b)=>b[0].length-a[0].length); for(const [a,b] of sorted) out=out.split(a).join(b); return out; }
function translateLocal(text,r,source){
 const v=(text||"").trim();
 const st=rowState(r);
 if(source==="kr"){
   if(!v){ st.actionRu=""; const el=document.querySelector(`[data-ar="${r}"]`); if(el)el.value=""; save(); return; }
   let out=translateByPhrases(v,KR_RU);
   const el=document.querySelector(`[data-ar="${r}"]`);
   if(out!==v && el){ el.value=out; st.actionRu=out; }
 }else{
   if(!v){ st.action=""; const el=document.querySelector(`[data-a="${r}"]`); if(el)el.value=""; save(); return; }
   let out=translateByPhrases(v,RU_KR);
   const el=document.querySelector(`[data-a="${r}"]`);
   if(out!==v && el){ el.value=out; st.action=out; }
 }
 save();
}

async function blobDataURL(blob){
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onload=()=>resolve(fr.result);
  fr.onerror=reject;
  fr.readAsDataURL(blob);
 });
}
function escPrint(x){
 return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
